<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Detalle de producto · Big5hats</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .product-detail { max-width: 960px; margin: 24px auto 60px; display: flex; gap: 24px; align-items: flex-start; padding: 0 12px; }
    .product-detail .media { flex: 1; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: rgba(255,255,255,0.03); }
    .product-detail .info { flex: 1.4; display: flex; flex-direction: column; gap: 10px; }
    .product-detail img { width: 100%; display: block; object-fit: cover; }
  </style>
</head>
<body>
  <header class="main-header">
    <div class="logo">
      <span class="logo-icon">B5</span>
      <span class="logo-text">Big5hats</span>
    </div>
    <nav class="navbar">
      <a href="index.html">Inicio</a>
      <a href="categorias.html">Categorias</a>
      <a class="active" href="productos.html">Productos</a>
    </nav>

    <button class="accessibility-btn" title="Opciones de accesibilidad" aria-label="Abrir opciones de accesibilidad">
      <i class="fas fa-universal-access accessibility-icon" aria-hidden="true"></i>
      <span class="label">Accesibilidad</span>
    </button>

    <a class="pill-button" href="login.html">Entrar</a>
  </header>
  <main>
    <section class="page">
      <div class="section-header">
        <p class="section-kicker">Detalle</p>
        <h2 id="productTitle">Cargando...</h2>
      </div>

      <div class="product-detail" id="productDetail">
        <div class="media" id="productMedia"><div class="media-hint">Imagen</div></div>
        <div class="info" id="productInfo">Informacion</div>
      </div>
    </section>
  </main>
  <script src="js/accessibility.js"></script>
  <script src="js/app.js"></script>
  <script src="js/producto-detalle.js"></script>
</body>
</html>
