<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Detalle de producto · Big5hats</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .product-detail { max-width: 900px; margin: 24px auto; display:flex; gap: 24px; align-items:flex-start; }
    .product-detail .media { flex: 1; }
    .product-detail .info { flex: 2; }
  </style>
</head>
<body>
  <header class="main-header">
    <div class="logo">
      <span class="logo-icon">B5</span>
      <span class="logo-text">Big5hats</span>
    </div>
    <nav class="navbar">
      <a href="index.html">Inicio</a>
      <a href="categorias.html">Categorías</a>
      <a href="productos.html">Productos</a>
    </nav>
    <a class="pill-button" href="login.html">Entrar</a>
  </header>
  <main>
    <section class="page">
      <div class="section-header">
        <p class="section-kicker">Detalle</p>
        <h2 id="productTitle">Cargando...</h2>
      </div>

      <div class="product-detail" id="productDetail">
        <div class="media" id="productMedia">Imagen</div>
        <div class="info" id="productInfo">Información</div>
      </div>
    </section>
  </main>
  <script src="js/app.js"></script>
  <script src="js/producto-detalle.js"></script>

</html>
